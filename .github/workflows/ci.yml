name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - production-gpui
      - cloud/**
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-linux:
    name: Core / Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Test harness core
        run: cargo test -p harness-core

      - name: Lint harness core
        run: cargo clippy -p harness-core --all-targets -- -D warnings

  app-macos:
    name: App / macOS
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Test workspace
        run: cargo test --workspace

      - name: Lint workspace
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Package release app
        run: bash scripts/package-macos.sh

      - name: Verify codesign
        run: |
          app="dist/DeepSeek Harness RS.app"
          codesign --verify --strict --verbose=2 "$app"
          spctl --assess --type execute "$app" || true

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-rs-macos
          path: dist/DeepSeek Harness RS.app
          if-no-files-found: error
