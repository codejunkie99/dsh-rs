[workspace]
resolver = "2"
members = ["crates/harness-core", "crates/dsh-app"]
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
async-trait = "0.1"
futures = "0.3"
zeroize = "1"
gpui = { path = "vendor/zed/crates/gpui", default-features = false, features = ["font-kit"] }
gpui_platform = { path = "vendor/zed/crates/gpui_platform", features = ["font-kit", "runtime_shaders"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 1
